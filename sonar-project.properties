# SonarCloud / SonarQube Project Configuration
sonar.projectKey=PaulaOramas_tetris-backend-system
sonar.organization=paulaoramas
sonar.projectName=tetris-backend-system

# Source directories
sonar.sources=tetris-core/src/main/java,tetris-app/src/main/java
sonar.tests=tetris-core/src/test/java,tetris-app/src/test/java
