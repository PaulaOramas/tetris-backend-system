name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-style:
    name: Lint & Style Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Code Formatting (Spotless)
        run: ./mvnw spotless:check -B

      - name: Verify Code Style Rules (Checkstyle)
        run: ./mvnw checkstyle:check -B

  build-and-test:
    name: Build & Test with JaCoCo Verification
    runs-on: ubuntu-latest
    needs: lint-and-style
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, Test and Verify Coverage Enforcement
        run: ./mvnw clean verify -B

      - name: Archive JaCoCo Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: |
            tetris-core/target/site/jacoco/
            tetris-app/target/site/jacoco/
          retention-days: 14

      - name: Archive Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: |
            tetris-core/target/surefire-reports/
            tetris-app/target/surefire-reports/
          retention-days: 7
